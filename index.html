
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODAY RACING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d16;color:white;font-family:Arial;text-align:center;overflow:hidden}
header{padding:12px;background:#111827;font-size:24px;font-weight:bold;color:#00e5ff}
#stats{display:flex;justify-content:space-around;padding:10px;background:#172033}
#game{position:relative;width:100%;height:68vh;overflow:hidden;background:linear-gradient(#182b3d,#34434d)}
.road{position:absolute;left:15%;width:70%;height:100%;background:#292d35;border-left:6px solid white;border-right:6px solid white}
.line{position:absolute;left:50%;height:100%;border-left:5px dashed #eee;animation:move .7s linear infinite}
@keyframes move{from{transform:translateY(-100px)}to{transform:translateY(0)}}
.car{position:absolute;width:48px;height:85px;border-radius:12px 12px 7px 7px;background:linear-gradient(90deg,#a80000,#ff3434,#a80000);bottom:20px;left:calc(50% - 24px);border:3px solid #eee;box-shadow:0 0 15px #f33}
.car:before{content:"";position:absolute;top:15px;left:7px;width:28px;height:24px;background:#8deaff;border-radius:5px}
.enemy{position:absolute;width:45px;height:78px;border-radius:10px;background:#ffcc00;border:3px solid white;top:-100px}
#controls{display:flex;justify-content:space-around;padding:15px}
button{background:#00bcd4;color:#00131a;border:0;border-radius:12px;padding:15px 25px;font-size:19px;font-weight:bold}
#start{margin:12px}
#message{font-size:20px;color:#00e5ff;padding:8px}
</style>
</head>
<body>
<header>🏁 ODAY RACING</header>
<div id="stats">
<span>النقاط: <b id="score">0</b></span>
<span>السرعة: <b id="speed">1</b></span>
<span>العملات: <b id="coins">0</b></span>
</div>
<div id="game">
<div class="road"></div>
<div class="line"></div>
<div id="player" class="car"></div>
<div id="enemy" class="enemy"></div>
</div>
<div id="message">استعد للسباق يا بطل!</div>
<button id="start" onclick="startGame()">ابدأ السباق 🚀</button>
<div id="controls">
<button onclick="move(-1)">⬅️ يسار</button>
<button onclick="nitro()">🔥 نيترو</button>
<button onclick="move(1)">يمين ➡️</button>
</div>
<script>
const player=document.getElementById("player");
const enemy=document.getElementById("enemy");
const scoreText=document.getElementById("score");
const coinsText=document.getElementById("coins");
const speedText=document.getElementById("speed");
const message=document.getElementById("message");
let lane=1,score=0,coins=0,speed=5,running=false,enemyY=-100;
let timer;
function move(dir){
 if(!running)return;
 lane=Math.max(0,Math.min(2,lane+dir));
 player.style.left=(25+lane*25)+"%";
 player.style.transform="translateX(-50%)";
}
function nitro(){
 if(running){speed=11;setTimeout(()=>speed=5,2000)}
}
function startGame(){
 if(running)return;
 running=true;score=0;lane=1;enemyY=-100;speed=5;
 player.style.left="50%";
 message.textContent="انطلق! تجنب السيارات!";
 timer=setInterval(update,40);
}
function update(){
 score++;
 scoreText.textContent=score;
 speedText.textContent=speed;
 enemyY+=speed;
 enemy.style.top=enemyY+"px";
 if(enemyY>document.getElementById("game").clientHeight){
  enemyY=-100;
  enemy.style.left=(20+Math.floor(Math.random()*3)*25)+"%";
  coins++;
  coinsText.textContent=coins;
 }
 let p=player.getBoundingClientRect();
 let e=enemy.getBoundingClientRect();
 if(p.left<e.right && p.right>e.left && p.top<e.bottom && p.bottom>e.top){
  endGame();
 }
}
function endGame(){
 running=false;clearInterval(timer);
 message.textContent="💥 انتهى السباق! نقاطك: "+score;
}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);
 if(e.code==="Space")nitro();
});
let touchStart=0;
document.getElementById("game").addEventListener("touchstart",e=>{
 touchStart=e.touches[0].clientX;
});
document.getElementById("game").addEventListener("touchend",e=>{
 let diff=e.changedTouches[0].clientX-touchStart;
 if(Math.abs(diff)>25)move(diff>0?1:-1);
});
</script>
</body>
</html>
